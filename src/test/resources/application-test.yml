# 테스트는 H2(MySQL 호환 모드)를 쓴다 (sp-docs/tech-stack.md §1).
# main application.yml 을 가리지 않도록 프로파일 설정으로 둔다 — 덧씌우기이므로 main 값이 살아 있다.
#
# 이 URL 은 sp-docs/tech-stack.md §5.3 의 정본이다. 파라미터를 빼지 않는다.
#   MODE=MySQL                   마이그레이션의 MySQL 문법(AUTO_INCREMENT, ENGINE=InnoDB, TEXT)
#   DATABASE_TO_LOWER            테이블명을 MySQL 과 같이 소문자로 저장한다
#   CASE_INSENSITIVE_IDENTIFIERS (위와 한 쌍)
#   DB_CLOSE_DELAY=-1            마지막 커넥션이 닫혀도 DB 를 유지한다. 없으면 Flyway 가
#                                다시 돌지 않아 이후 테스트가 "테이블 없음"으로 간헐 실패한다
# DB_CLOSE_ON_EXIT=FALSE 는 넣지 않는다 — JVM 종료는 테스트가 끝난 시점이라 효과가 없다.
spring:
  datasource:
    url: jdbc:h2:mem:sp_board;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 스키마 출처를 Flyway 하나로 고정한다. 임베디드 H2 의 기본값 create-drop 을 쓰면
      # 마이그레이션이 아니라 엔티티로부터 스키마가 조용히 생성된다 (sp-docs/tech-stack.md §5.1).
      ddl-auto: validate

# 환경 의존 값은 환경변수로 외부화한다 (sp-docs/tech-stack.md §4.3).
# 비밀 값(DB 비밀번호)에는 기본값을 두지 않는다 — 없으면 기동이 실패해야 한다.
spring:
  application:
    name: board-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sp_board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  # 환경 설정이 아니라 데이터 경계의 계약이라서 세 서비스에 같이 둔다 (sp-docs/adr/0011 "결과").
  # 이 경로(LocalDateTime + DATETIME)의 저장 변환을 정하는 것이 이 설정이므로 반드시
  # 둔다 — 값을 UTC 로 바꾸면 저장값이 UTC 가 된다. 지우면 Connector/J 가 MySQL 서버
  # 존으로 폴백해 그 존이 +09:00 인 환경에서만 우연히 맞는다. "있음 vs 없음" 으로는
  # 가를 수 없고 값을 바꿔야 갈린다 (sp-docs/tech-stack.md §6 의 I-03 리뷰 실측)
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service 가 발급한 토큰을 공개키로 검증만 한다. 개인키는 이 서비스에 없다
          # (sp-docs/security.md §2 §3). 공개키는 커밋해도 된다.
          #
          # 이 키 이름이 정본이다 (sp-docs/tech-stack.md §2.1). 표준 키를 쓰면 스타터가
          # JwtDecoder 를 자동구성하므로 서명 검증·만료 확인·SecurityContext 주입을 직접
          # 만들 것이 없다 — JWT 필터를 직접 만들지 않는다 (§2)
          public-key-location: classpath:jwt-public.pem
  # 첨부 올리기의 크기 한도다 (sp-docs/tech-stack.md §4.5). 넘으면 413 C008
  # (sp-docs/api-contract.md §8.1). 개당 한도는 사용자 결정이고 Boot 기본값(1MB)이 그보다
  # 작으므로 반드시 적는다. 요청 하나에 파일 하나이므로 요청 한도는 개당 한도보다 조금 크게
  # 둔다(파일 하나 + multipart 머리)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    # 한도를 넘은 요청의 나머지 본문을 읽어 버리는 양이다 (sp-docs/tech-stack.md §4.5). 이보다
    # 크게 남으면 Tomcat 이 연결을 끊을 수 있다 — 큰 사진을 실수로 고른 사용자가 연결 오류가
    # 아니라 413 을 받게 하려는 값이다
    max-swallow-size: 10MB
  # X-Forwarded-For 로 remoteAddr 를 바꾸지 않는다 — 비로그인 조회자의 판정 키가 그 값을 쓰고,
  # 그 헤더는 클라이언트가 임의로 쓴다 (sp-docs/tech-stack.md §4.5, sp-docs/security.md §9).
  # 클라우드 플랫폼을 감지하지 않는 로컬 기본값과 같지만 의도를 보이려고 적는다 — Boot 는
  # 클라우드 플랫폼을 감지하면 기본값이 NATIVE 다 (§4.5)
  forward-headers-strategy: none

# health 만 노출한다. 그 밖의 actuator 경로는 노출 자체를 막는다
# (sp-docs/security.md §5.1.1). 인가 쪽 차단은 SecurityConfig 가 한다 — 그래서 무토큰은
# 401 A001, 유효 토큰은 403 A004 이고 404 가 아니다 (§5.1.1 의 측정값)
management:
  endpoints:
    web:
      exposure:
        include: health

# 1차부터 글·댓글 생성 시 member 의 내부 API 를 호출한다 (sp-docs/adr/0012 §6).
# 타임아웃은 sp-docs/nfr.md §3 이 정본이다. 기본값(무제한)으로 두지 않는다.
member-service:
  url: ${MEMBER_SERVICE_URL:http://localhost:8081}
  internal-api-key: ${INTERNAL_API_KEY}
  connect-timeout: 1s
  read-timeout: 3s

# CORS 허용 오리진 화이트리스트.
#
# 허용 오리진은 환경이 정한다 (sp-docs/security.md §1.1). 정책값이므로 기본값을 두지
# 않는다 — 임의의 기본값을 두면 그 값이 정해진 정책인지 임시값인지 구분할 수 없고 운영에
# 그대로 나간다 (sp-docs/tech-stack.md §4.3). 비었거나 * 가 섞이면 SecurityConfig 의
# 가드가 기동을 실패시킨다. 로컬 값은 application-local.yml 이 준다
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 첨부 저장 루트 (sp-docs/tech-stack.md §4.5). 정책값이므로 기본값을 두지 않는다 (§4.3).
# 이미 있고 쓸 수 있는 디렉터리여야 하고 서버가 만들지 않는다 — 아니면 기동이 실패한다.
# @ConfigurationProperties 로 묶으므로 환경변수가 없으면 이 placeholder 가 리터럴로 들어온다
# (§4.3 의 측정값). 그것을 AttachmentStorageProperties 의 가드가 막는다
attachment:
  storage-root: ${ATTACHMENT_STORAGE_ROOT}

# 조회수 판정 (sp-docs/tech-stack.md §4.5, sp-docs/security.md §9).
# hmac-secret 은 비밀값이므로 기본값을 두지 않는다 (§4.3). 설정 문자열의 UTF-8 바이트가 32 이상
# 이어야 하고 Base64 로 디코드하지 않는다 — 비었거나 짧거나 미해석 placeholder 면
# ViewCountProperties 의 가드가 기동을 실패시킨다.
# cleanup-interval 은 편의값이다 — 오래된 판정 행을 지우는 주기이고 보존 기간의 상한을 정한다
view-count:
  hmac-secret: ${VIEW_COUNT_HMAC_SECRET}
  cleanup-interval: PT1H

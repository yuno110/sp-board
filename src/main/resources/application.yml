# 환경 의존 값은 환경변수로 외부화한다 (sp-docs/tech-stack.md §4.3).
# 비밀 값(DB 비밀번호)에는 기본값을 두지 않는다 — 없으면 기동이 실패해야 한다.
spring:
  application:
    name: board-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sp_board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service 가 발급한 토큰을 공개키로 검증만 한다. 개인키는 이 서비스에 없다
          # (sp-docs/security.md §2 §3). 공개키는 커밋해도 된다.
          #
          # 이 키 이름이 정본이다 (sp-docs/tech-stack.md §2.1). 표준 키를 쓰면 스타터가
          # JwtDecoder 를 자동구성하므로 서명 검증·만료 확인·SecurityContext 주입을 직접
          # 만들 것이 없다 — JWT 필터를 직접 만들지 않는다 (§2)
          public-key-location: classpath:jwt-public.pem

server:
  port: ${SERVER_PORT:8082}

# health 만 노출한다. 그 밖의 actuator 경로는 노출 자체를 막는다
# (sp-docs/security.md §5.1.1). 인가 쪽 차단은 SecurityConfig 가 한다 — 그래서 무토큰은
# 401 A001, 유효 토큰은 403 A004 이고 404 가 아니다 (§5.1.1 의 측정값)
management:
  endpoints:
    web:
      exposure:
        include: health

# 1차부터 글·댓글 생성 시 member 의 내부 API 를 호출한다 (sp-docs/adr/0012 §6).
# 타임아웃은 sp-docs/nfr.md §3 이 정본이다. 기본값(무제한)으로 두지 않는다.
member-service:
  url: ${MEMBER_SERVICE_URL:http://localhost:8081}
  internal-api-key: ${INTERNAL_API_KEY}
  connect-timeout: 1s
  read-timeout: 3s

# CORS 허용 오리진 화이트리스트.
#
# 허용 오리진은 환경이 정한다 (sp-docs/security.md §1.1). 정책값이므로 기본값을 두지
# 않는다 — 임의의 기본값을 두면 그 값이 정해진 정책인지 임시값인지 구분할 수 없고 운영에
# 그대로 나간다 (sp-docs/tech-stack.md §4.3). 비었거나 * 가 섞이면 SecurityConfig 의
# 가드가 기동을 실패시킨다. 로컬 값은 application-local.yml 이 준다
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
